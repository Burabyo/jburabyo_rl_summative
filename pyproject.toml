[project]
name = "imisoro-rl"
version = "0.1.0"
description = "Imisoro Compliance Coach: comparing DQN, REINFORCE, PPO and A2C (TorchRL) on a Rwandan small-business tax-compliance environment"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gymnasium>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "tensordict>=0.15.6",
    "torch>=2.15.0",
    "torchrl>=0.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
